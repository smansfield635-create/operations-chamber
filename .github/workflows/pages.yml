name: Publish public-safe Operations Chamber
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - index.html
      - dashboard.mjs
      - data.json
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: operations-chamber-pages
  cancel-in-progress: false
jobs:
  deploy-public-safe-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out existing host
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact public-safe release boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html && test -s dashboard.mjs && test -s data.json
          node --check dashboard.mjs
          node <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('data.json','utf8'));
          const h = fs.readFileSync('index.html','utf8');
          const j = fs.readFileSync('dashboard.mjs','utf8');
          const keys = obj => Object.keys(obj).sort().join('|');
          const expected = ['schema','observedAt','coverage','repositories','projects','instruments','study','commandsEnabled','rollingStudySummary'].sort().join('|');
          if(d.schema !== 'DGB_OPERATIONS_CHAMBER_DASHBOARD_DATA_v1' || d.commandsEnabled !== false || d.coverage !== 'PARTIAL' || keys(d) !== expected) throw Error('PRIVATE_DATA_GUARD');
          if(d.repositories.length !== 2 || d.projects.length !== 46 || d.instruments.records.length !== 6 || d.study.status !== 'AVAILABLE') throw Error('CATALOG_CARDINALITY_INVALID');
          const aliases = new Set(['catalog/private-study','catalog/public-estate']);
          if(!d.repositories.every(r => aliases.has(r.name) && r.status === 'HISTORICAL_CAPTURE' && r.generation === null)) throw Error('REPOSITORY_ALIAS_INVALID');
          for(const p of d.projects){
            if(!/^[A-Z0-9_]{2,80}$/.test(p.id) || !aliases.has(p.repository) || p.frontier !== 'UNVERIFIED' || p.blockers !== 'UNVERIFIED') throw Error('PROJECT_METADATA_INVALID');
            if(!Number.isSafeInteger(p.activeCount) || p.activeCount < 0 || !Number.isSafeInteger(p.totalRecorded) || p.totalRecorded < p.activeCount) throw Error('PROJECT_COUNT_INVALID');
            if(p.operations.length || p.recentOperations.length || p.pullRequests.length || p.workflowRuns.length) throw Error('PRIVATE_OPERATION_DETAILS_PRESENT');
          }
          for(const i of d.instruments.records){
            if(!/^[a-z0-9-]{5,100}\.ya?ml$/.test(i.name) || i.name.includes('/') || i.currentHeadRunId !== null) throw Error('INSTRUMENT_PATH_OR_SOURCE_ID_INVALID');
            if(i.latestRun && (i.latestRun.url !== null || !['completed','in_progress','queued'].includes(i.latestRun.status))) throw Error('PRIVATE_RUN_REFERENCE_PRESENT');
          }
          if(d.study.source !== null || !Number.isFinite(Date.parse(d.study.cutoff)) || ['total','materialUnits','PARAMOUNT','STANDARD','SUPPORT'].some(k => !Number.isSafeInteger(d.study.totals[k]))) throw Error('HISTORICAL_STUDY_INVALID');
          if(/https?:\/\/|github\.com|\.github\/|privateSavedSnapshotData|PRIVATE_GITHUB_TOKEN|receiptSha256|archiveSha256|\/smansfield635-create\/geodiametrics1\//i.test(JSON.stringify(d))) throw Error('PRIVATE_REFERENCE_DISCLOSURE');
          const s = d.rollingStudySummary;
          if(s.schema !== 'DGB_CHAMBER_PUBLIC_SAFE_AGGREGATE_v1' || keys(s.metrics) !== ['classified','unresolved','reviews','auditFlags'].sort().join('|')) throw Error('AGGREGATE_SCHEMA');
          if(!Object.values(s.metrics).every(Number.isSafeInteger) || !Number.isFinite(Date.parse(s.savedThrough)) || !Number.isFinite(Date.parse(s.capturedAt))) throw Error('AGGREGATE_INVALID');
          if(!h.includes('data-target="home-view"') || !h.includes('data-target="evidence-view"') || (h.match(/class="space-portal /g)||[]).length !== 4) throw Error('FOUR_SPACE_INVALID');
          if(!h.includes('connect-src') || !j.includes("fetchImpl('./data.json'")) throw Error('LOCAL_ORIGIN_GUARD');
          if(/PRIVATE_GITHUB_TOKEN|privateSavedSnapshotData|\/smansfield635-create\/geodiametrics1\//.test(h+j)) throw Error('PRIVATE_REFERENCE_PRESENT');
          console.log('PUBLIC_SAFE_FOUR_SPACE_PASS', s.metrics.classified, s.savedThrough);
          NODE
          mkdir -p "$RUNNER_TEMP/chamber-site"
          cp index.html dashboard.mjs data.json "$RUNNER_TEMP/chamber-site/"
          touch "$RUNNER_TEMP/chamber-site/.nojekyll"
          test "$(find "$RUNNER_TEMP/chamber-site" -maxdepth 1 -type f | wc -l)" -eq 4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/chamber-site
      - name: Deploy public-safe dashboard
        id: deployment
        uses: actions/deploy-pages@v4
