name: Publish restricted Operations Chamber notice
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - index.html
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: operations-chamber-pages
  cancel-in-progress: false
jobs:
  deploy-restricted-notice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out own restricted notice
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Stage inert notice only
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q 'DGB_STANDALONE_OWNER_RESTRICTED_NOTICE_V1' index.html
          if grep -Eiq '<script|<form|<input|<button|data\.json|dashboard\.mjs|operations-chamber-observations' index.html; then exit 1; fi
          mkdir -p "$RUNNER_TEMP/chamber-notice"
          cp index.html "$RUNNER_TEMP/chamber-notice/index.html"
          touch "$RUNNER_TEMP/chamber-notice/.nojekyll"
          test "$(find "$RUNNER_TEMP/chamber-notice" -maxdepth 1 -type f | wc -l)" -eq 2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/chamber-notice
      - name: Deploy restricted notice
        id: deployment
        uses: actions/deploy-pages@v4
